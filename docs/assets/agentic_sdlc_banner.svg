<svg width="1800" height="760" viewBox="0 0 1800 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>

    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f7fff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4f7fff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1c2438" stroke-width="1"/>
    </pattern>

    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c084fc"/>
    </marker>
    <marker id="arrowHeadDash" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5b6b8c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1800" height="760" fill="url(#bg)"/>
  <rect width="1800" height="760" fill="url(#grid)" opacity="0.55"/>
  <circle cx="900" cy="360" r="520" fill="url(#glowSpot)"/>

  <!-- Title -->
  <text x="900" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="3" fill="#f1f5f9">AGENTIC SOFTWARE DEVELOPMENT LIFECYCLE</text>
  <text x="900" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19.5" letter-spacing="1.1" fill="#7c8aad">FROM DESCRIPTION &#8594; REQUIREMENTS &#8594; ENGINEERING OUTPUT, DRIVEN BY GOVERNED AGENTIC ORCHESTRATION</text>

  <!-- ===== Connecting arrows (drawn first, under cards) ===== -->
  <!-- arrow 1 -->
  <line x1="512" y1="380" x2="686" y2="380" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowHead)"/>
  <!-- arrow 2 -->
  <line x1="1114" y1="380" x2="1288" y2="380" stroke="url(#arrowGrad)" stroke-width="3" marker-end="url(#arrowHead)"/>

  <!-- feedback loop: Code back to Requirements (agentic iteration) -->
  <path d="M 1490 494 C 1490 620, 900 640, 900 640 C 900 640, 400 640, 310 500"
        fill="none" stroke="#5b6b8c" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowHeadDash)"/>
  <text x="900" y="676" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="1" fill="#647192">AGENTS EVALUATE OUTPUT AND SUPPORT GOVERNED UPSTREAM REFINEMENT</text>

  <!-- ===== Agent node badges sitting on the arrows ===== -->
  <g transform="translate(599,380)" filter="url(#softGlow)">
    <circle r="26" fill="#131a2c" stroke="url(#accent1)" stroke-width="2.5"/>
    <g stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-11"/>
      <line x1="0" y1="0" x2="9.5" y2="5.5"/>
      <line x1="0" y1="0" x2="-9.5" y2="5.5"/>
    </g>
    <circle cx="0" cy="-11" r="2.4" fill="#a5b4fc"/>
    <circle cx="9.5" cy="5.5" r="2.4" fill="#a5b4fc"/>
    <circle cx="-9.5" cy="5.5" r="2.4" fill="#a5b4fc"/>
    <circle cx="0" cy="0" r="3.2" fill="#131a2c" stroke="#a5b4fc" stroke-width="1.8"/>
  </g>
  <text x="599" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1" fill="#8b96b8">ANALYST AGENT</text>

  <g transform="translate(1201,380)" filter="url(#softGlow)">
    <circle r="26" fill="#131a2c" stroke="url(#accent2)" stroke-width="2.5"/>
    <g stroke="#e2b8fc" stroke-width="1.8" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-11"/>
      <line x1="0" y1="0" x2="9.5" y2="5.5"/>
      <line x1="0" y1="0" x2="-9.5" y2="5.5"/>
    </g>
    <circle cx="0" cy="-11" r="2.4" fill="#e2b8fc"/>
    <circle cx="9.5" cy="5.5" r="2.4" fill="#e2b8fc"/>
    <circle cx="-9.5" cy="5.5" r="2.4" fill="#e2b8fc"/>
    <circle cx="0" cy="0" r="3.2" fill="#131a2c" stroke="#e2b8fc" stroke-width="1.8"/>
  </g>
  <text x="1201" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1" fill="#8b96b8">BUILDER AGENT</text>

  <!-- ===== Stage 1: Description ===== -->
  <g>
    <rect x="120" y="250" width="392" height="260" rx="18" fill="#121729" stroke="url(#accent1)" stroke-width="2"/>
    <rect x="120" y="250" width="392" height="260" rx="18" fill="#38bdf8" opacity="0.04"/>
    <!-- icon: document with lines -->
    <g transform="translate(316,318)">
      <rect x="-34" y="-38" width="68" height="86" rx="8" fill="none" stroke="url(#accent1)" stroke-width="3"/>
      <line x1="-20" y1="-14" x2="20" y2="-14" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-20" y1="2" x2="20" y2="2" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-20" y1="18" x2="6" y2="18" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="316" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="1" fill="#e8edf7">DESCRIPTION</text>
    <text x="316" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8b96b8">Plain-language intent</text>
    <text x="316" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8b96b8">captured from the user</text>
  </g>

  <!-- ===== Stage 2: Requirements ===== -->
  <g>
    <rect x="710" y="250" width="392" height="260" rx="18" fill="#121729" stroke="url(#accent2)" stroke-width="2"/>
    <rect x="710" y="250" width="392" height="260" rx="18" fill="#a78bfa" opacity="0.04"/>
    <!-- icon: checklist -->
    <g transform="translate(906,318)">
      <rect x="-34" y="-38" width="68" height="86" rx="8" fill="none" stroke="url(#accent2)" stroke-width="3"/>
      <g stroke="#d8b4fe" stroke-width="3.2" stroke-linecap="round">
        <path d="M-22,-16 l6,6 l11,-13"/>
        <path d="M-22,4 l6,6 l11,-13"/>
      </g>
      <line x1="2" y1="-13" x2="21" y2="-13" stroke="#d8b4fe" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="2" y1="7" x2="21" y2="7" stroke="#d8b4fe" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <text x="906" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="1" fill="#e8edf7">REQUIREMENTS</text>
    <text x="906" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8b96b8">Structured, testable specs</text>
    <text x="906" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8b96b8">agents derive and validate</text>
  </g>

  <!-- ===== Stage 3: Code ===== -->
  <g>
    <rect x="1300" y="250" width="392" height="260" rx="18" fill="#121729" stroke="url(#accent3)" stroke-width="2"/>
    <rect x="1300" y="250" width="392" height="260" rx="18" fill="#f472b6" opacity="0.04"/>
    <!-- icon: code brackets -->
    <g transform="translate(1496,318)" font-family="Arial, Helvetica, sans-serif" font-weight="700">
      <rect x="-34" y="-38" width="68" height="86" rx="8" fill="none" stroke="url(#accent3)" stroke-width="3"/>
      <text x="0" y="10" text-anchor="middle" font-size="34" fill="#fbcfe8">&lt;/&gt;</text>
    </g>
    <text x="1496" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.6" fill="#e8edf7">ENGINEERING OUTPUT</text>
    <text x="1496" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8b96b8">Generated and validated</text>
    <text x="1496" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8b96b8">under governed autonomy</text>
  </g>

  <!-- footer accent line -->
  <rect x="120" y="718" width="1560" height="2" fill="url(#arrowGrad)" opacity="0.35"/>
</svg>
